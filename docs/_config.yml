title: tickr
description: Reliable async messaging for Go microservices — transactional outbox without an external broker.
theme: just-the-docs
url: https://ndmt1at21.github.io
baseurl: /tickr

color_scheme: dark

aux_links:
  GitHub: https://github.com/ndmt1at21/tickr
  pkg.go.dev: https://pkg.go.dev/github.com/ndmt1at21/tickr

aux_links_new_tab: true

search_enabled: true
heading_anchors: true

footer_content: 'MIT licensed. <a href="https://github.com/ndmt1at21/tickr">Source on GitHub</a>.'

plugins:
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor

callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
