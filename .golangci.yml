run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
    - unconvert
    - bodyclose
    - nolintlint

linters-settings:
  goimports:
    local-prefixes: github.com/ndmt1at21/tickr
  revive:
    rules:
      - name: exported
        disabled: false

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - revive
  max-same-issues: 0
  max-issues-per-linter: 0
